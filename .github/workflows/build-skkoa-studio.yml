name: Build SKKOA Studio

on:
    push:
        paths:
            - "skkoa-studio/**"
            - "compiler/**"
            - "download/studio/**"
            - ".github/workflows/build-skkoa-studio.yml"
    pull_request:
        paths:
            - "skkoa-studio/**"
            - "compiler/**"
            - "download/studio/**"
            - ".github/workflows/build-skkoa-studio.yml"

jobs:
    build:
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: "8.0.x"
            - uses: actions/setup-python@v5
              with:
                  python-version: "3.12"
                  cache: "pip"
                  cache-dependency-path: skkoa-studio/installer/scripts/requirements.txt
            - name: Install Python dependencies
              shell: pwsh
              run: python -m pip install -r .\skkoa-studio\installer\scripts\requirements.txt
            - uses: msys2/setup-msys2@v2
              with:
                  msystem: MINGW64
                  update: true
                  install: mingw-w64-x86_64-gcc mingw-w64-x86_64-nasm
            - name: Add MinGW to PATH
              shell: pwsh
              run: echo "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            - name: Install Inno Setup
              shell: pwsh
              run: choco install innosetup -y --no-progress
            - name: Build all
              shell: pwsh
              run: .\skkoa-studio\build-all.ps1
            - uses: actions/upload-artifact@v4
              with:
                  name: SKKOA-Studio-win-x64
                  path: skkoa-studio/editor/artifacts/SKKOA-Studio-win-x64.zip
            - uses: actions/upload-artifact@v4
              with:
                  name: SKKOA-Studio-Setup-x64
                  path: skkoa-studio/installer/output/SKKOA-Studio-Setup-x64.exe
            - uses: actions/upload-artifact@v4
              with:
                  name: SKKOA-Studio-Web-Download
                  path: download/studio/SKKOA-Studio-Setup-x64.exe
